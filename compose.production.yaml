name: solovibe-production
x-app-environment: &app-environment
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  APP_URL: ${APP_URL:?Set the public HTTPS origin}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set the server runtime environment}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
  OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1.5}
  COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ENDPOINT: ${R2_ENDPOINT:-https://${R2_ACCOUNT_ID:-unset}.r2.cloudflarestorage.com}
  R2_BUCKET: ${R2_BUCKET:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solovibe}
      POSTGRES_USER: ${POSTGRES_USER:-solovibe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the server runtime environment}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    image: solovibe-app:${APP_REVISION:?Deploy an exact Git SHA}
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:?Deploy an exact Git SHA}
    command: ["node", "migrate.cjs"]
    environment: *app-environment
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  app:
    image: solovibe-app:${APP_REVISION:?Deploy an exact Git SHA}
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:?Deploy an exact Git SHA}
    environment: *app-environment
    ports: ["127.0.0.1:${APP_PORT:-3000}:3000"]
    volumes: [file-data:/app/storage]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
  file-data:

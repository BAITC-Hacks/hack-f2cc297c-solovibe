name: Check and deploy from source (manual Actions)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solovibe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: bash -n scripts/deploy-ssh.sh && bash scripts/deploy-ssh.test.sh
      - name: Upload and deploy validated source archive over SSH
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_ROOT: ${{ vars.SSH_DEPLOY_ROOT || '/opt/solovibe-rehearsal' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$SSH_HOST" && -n "$SSH_USER" && -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || { echo 'Missing required SSH configuration' >&2; exit 1; }
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_ROOT" =~ ^/[a-zA-Z0-9_/-]+$ && "$DEPLOY_ROOT" != / && "$DEPLOY_ROOT" != *..* ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -f "$keydir/key" "$keydir/known_hosts" "$keydir/source.tar"; rmdir "$keydir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$keydir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$keydir/known_hosts"
          git archive --format=tar --output="$keydir/source.tar" "$GITHUB_SHA"
          # actions/checkout retains the job's read-only GitHub token for this check.
          latest=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo 'Validated revision is no longer main; skipping deployment.'
            exit 0
          fi
          ssh_options=(-i "$keydir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10)
          destination="$SSH_USER@$SSH_HOST"
          incoming="$DEPLOY_ROOT/incoming"
          temporary="$incoming/$GITHUB_SHA.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.tar.tmp"
          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$destination" "umask 077; mkdir -p $incoming"
          scp "${ssh_options[@]}" -P "$SSH_PORT" "$keydir/source.tar" "$destination:$temporary"
          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$destination" "mv -f $temporary $incoming/$GITHUB_SHA.tar && bash -s -- $GITHUB_SHA $DEPLOY_ROOT" < scripts/deploy-ssh.sh
